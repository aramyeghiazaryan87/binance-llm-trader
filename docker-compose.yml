services:
  trader:
    build: .
    container_name: binance-llm-trader
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # остановка: бот получает SIGTERM и завершает текущий шаг
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
